name: Publish

# Builds the sdist and the wheel and publishes them on PyPI when a version
# tag is pushed. PyPI trusts this workflow (trusted publishing): no token is
# stored. On PyPI, the publisher is the repository nvelden/geneviewer-py,
# the workflow publish.yml and the environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The tag is the version of the package
      - shell: bash
        run: |
          version=$(ls dist/*.tar.gz | sed -E 's/.*geneviewer_py-(.*)\.tar\.gz/\1/')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not the version ${version} of pyproject.toml" >&2
            exit 1
          fi
      # The wheel works on its own: installed without the checkout, it loads
      # its datasets and builds a chart
      - shell: bash
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/wheel/bin/python -c "
          from geneviewer import GC, datasets
          GC(datasets.load('ophA_clusters'), cluster='cluster', group='class').labels('name').to_spec()
          "
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geneviewer-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
